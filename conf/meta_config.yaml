model:
  id: ecommerce
  version: 1
  description: 电商订单单轮查询语义模型

tables:
  - name: dim_region
    role: dim
    description: 地区维度表，用于描述订单发生的地理区域信息。
    columns:
      - name: region_id
        role: primary_key
        description: 地区唯一标识。
        alias: [地区ID, 区域ID]
        sync: false

      - name: province
        role: dimension
        description: 订单所属的省份名称。
        alias: [省份, 省, 所在省份]
        sync: true

      - name: region_name
        role: dimension
        description: 订单所属的大区名称，如华东、华南等。
        alias: [地区, 区域, 大区]
        sync: true

      - name: country
        role: dimension
        description: 地区所属国家名称。
        alias: [国家, 国家名称]
        sync: true

  - name: dim_customer
    role: dim
    description: 客户维度表，描述下单客户的基本属性。
    columns:
      - name: customer_id
        role: primary_key
        description: 客户唯一标识。
        alias: [客户ID, 用户ID]
        sync: false

      - name: customer_name
        role: dimension
        description: 客户名称。
        alias: [客户名称, 用户名称]
        sync: true

      - name: gender
        role: dimension
        description: 客户性别。
        alias: [性别]
        sync: true

      - name: member_level
        role: dimension
        description: 客户会员等级。
        alias: [会员等级, 用户等级]
        sync: true

  - name: dim_product
    role: dim
    description: 商品维度表，描述商品的基本属性信息。
    columns:
      - name: product_id
        role: primary_key
        description: 商品唯一标识。
        alias: [商品ID, 产品ID]
        sync: false

      - name: product_name
        role: dimension
        description: 商品名称。
        alias: [商品名称, 产品名称]
        sync: true

      - name: category
        role: dimension
        description: 商品所属品类。
        alias: [商品类别, 品类, 分类]
        sync: true

      - name: brand
        role: dimension
        description: 商品品牌名称。
        alias: [品牌, 品牌名称]
        sync: true

  - name: dim_date
    role: dim
    description: 时间维度表，用于多时间粒度分析。
    columns:
      - name: date_id
        role: primary_key
        description: 日期唯一标识，格式 yyyyMMdd。
        alias: [日期ID, 日期]
        sync: false

      - name: year
        role: dimension
        description: 年份。
        alias: [年, 年份]
        sync: false

      - name: quarter
        role: dimension
        description: 季度。
        alias: [季度]
        sync: true

      - name: month
        role: dimension
        description: 月份。
        alias: [月, 月份]
        sync: false

      - name: day
        role: dimension
        description: 日。
        alias: [日, 天]
        sync: false

  - name: fact_order
    role: fact
    description: 订单事实表，记录订单数量和金额等核心指标。
    columns:
      - name: order_id
        role: primary_key
        description: 订单唯一标识。
        alias: [订单ID]
        sync: false

      - name: customer_id
        role: foreign_key
        description: 关联客户维度的外键。
        alias: [客户ID, 用户ID]
        sync: false

      - name: product_id
        role: foreign_key
        description: 关联商品维度的外键。
        alias: [商品ID, 产品ID]
        sync: false

      - name: date_id
        role: foreign_key
        description: 关联时间维度的外键。
        alias: [日期, 下单日期]
        sync: false

      - name: region_id
        role: foreign_key
        description: 关联地区维度的外键。
        alias: [地区ID, 区域ID]
        sync: false

      - name: order_quantity
        role: measure
        description: 订单中商品的购买数量。
        alias: [销量, 购买数量, 件数]
        sync: false

      - name: order_amount
        role: measure
        description: 订单金额。
        alias: [销售额, 订单金额, 收入]
        sync: false

datasets:
  - id: orders
    table: fact_order
    grain: one_row_per_order
    primary_key: order_id
    time_dimension: order_date

relationships:
  order_date:
    source: fact_order.date_id
    target: dim_date.date_id
    cardinality: many_to_one
    enabled: true
  order_region:
    source: fact_order.region_id
    target: dim_region.region_id
    cardinality: many_to_one
    enabled: true
  order_product:
    source: fact_order.product_id
    target: dim_product.product_id
    cardinality: many_to_one
    enabled: true
  order_customer:
    source: fact_order.customer_id
    target: dim_customer.customer_id
    cardinality: many_to_one
    enabled: true

dimensions:
  - id: region_name
    name: 大区
    table: dim_region
    column: region_name
    aliases: [地区, 区域, 大区]
  - id: province
    name: 省份
    table: dim_region
    column: province
    aliases: [省份, 省, 所在省份]
  - id: country
    name: 国家
    table: dim_region
    column: country
    aliases: [国家, 国家名称]
  - id: customer_name
    name: 客户名称
    table: dim_customer
    column: customer_name
    aliases: [客户名称, 用户名称]
  - id: gender
    name: 性别
    table: dim_customer
    column: gender
    aliases: [性别]
  - id: member_level
    name: 会员等级
    table: dim_customer
    column: member_level
    aliases: [会员等级, 用户等级]
  - id: product_name
    name: 商品名称
    table: dim_product
    column: product_name
    aliases: [商品名称, 产品名称]
  - id: category
    name: 商品类别
    table: dim_product
    column: category
    aliases: [商品类别, 品类, 分类]
  - id: brand
    name: 品牌
    table: dim_product
    column: brand
    aliases: [品牌, 品牌名称]

time_dimensions:
  order_date:
    table: dim_date
    year_field: year
    quarter_field: quarter
    month_field: month
    day_field: day
    date_key_field: date_id
    supported_grains: [year, quarter, month, day]
    month_filter_requires_year: true

metrics:
  - id: paid_amount
    name: 订单实付金额
    description: 订单实付金额总和。
    type: additive
    expression: SUM(fact_order.order_amount)
    base_dataset: orders
    aliases: [实付金额, 订单金额]
    relevant_columns: [fact_order.order_amount]
  - id: product_quantity
    name: 商品购买数量
    description: 商品购买数量总和。
    type: additive
    expression: SUM(fact_order.order_quantity)
    base_dataset: orders
    aliases: [购买数量, 销售数量, 件数]
    relevant_columns: [fact_order.order_quantity]
  - id: order_count
    name: 订单数
    description: 去重订单数量。
    type: distinct_count
    expression: COUNT(DISTINCT fact_order.order_id)
    base_dataset: orders
    aliases: [订单量]
    relevant_columns: [fact_order.order_id]
  - id: average_quantity_per_order
    name: 平均每单购买件数
    description: 当前筛选和分组范围内的商品购买数量除以订单数。
    type: ratio
    numerator: product_quantity
    denominator: order_count
    base_dataset: orders
    aliases: [AOV, 平均每单购买数量]
    relevant_columns: [fact_order.order_quantity, fact_order.order_id]
